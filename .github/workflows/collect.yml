name: 임상시험·공시 수집

on:
  schedule:
    # 매시 7분에 실행 (정시는 혼잡해서 밀린다)
    - cron: "7 * * * *"
  workflow_dispatch:        # 버튼으로 직접 실행
  push:
    branches: [main]
    paths: ["backend/**", "site/**", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: 지난번 데이터베이스 가져오기
        # gh-pages 가지에 지난 결과가 들어 있다.
        # 과거 스냅샷이 있어야 '무엇이 달라졌는지' 를 알 수 있다.
        run: |
          mkdir -p public
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prev
            [ -f prev/biotrial.db ] && cp prev/biotrial.db . && echo "지난 데이터 불러옴 ($(du -h biotrial.db | cut -f1))"
            rm -rf prev
          else
            echo "첫 실행입니다"
          fi

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-phone.txt

      - name: 필요한 것 설치
        run: pip install -q -r backend/requirements-phone.txt

      - name: 수집
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///../biotrial.db
          TZ: Asia/Seoul
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          ALERT_MIN_SEVERITY: ${{ vars.ALERT_MIN_SEVERITY || 'HIGH' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 이메일 알림 (저장소 Settings -> Secrets 에 넣으면 동작)
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
        run: |
          python -m app.seed
          python -m app.collect_once

      - name: 화면용 데이터 만들기
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///../biotrial.db
          TZ: Asia/Seoul
        run: python -m app.export_static --out ../public --site ../site

      - name: 데이터베이스 함께 저장
        run: |
          cp biotrial.db public/biotrial.db
          echo "" > public/.nojekyll
          du -sh public

      - name: 웹에 올리기
        run: |
          cd public
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "자동 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
          echo "완료"
